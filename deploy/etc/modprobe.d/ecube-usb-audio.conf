# /etc/modprobe.d/ecube-usb-audio.conf
#
# USB 音频驱动的 modprobe 配置（默认全部注释，按需启用）。
#
# 依赖顺序由 modules.dep 自动处理，一般不需要 softdep。
# 只有在模块依赖信息缺失、需要强制顺序时才取消下面这行的注释：
#
# softdep snd-usb-audio pre: snd-hwdep snd-usbmidi-lib snd-rawmidi snd-seq-device
#
# 固定声卡编号：需要 card 号稳定时启用（会占用 1 号槽，其它声卡顺延）。
# 注意：如果 1 号槽已被内置声卡占用，会导致加载失败，请先确认
#       /proc/asound/cards 的占用情况。
#
# options snd-usb-audio index=1
#
# 需要把驱动绑定到指定 VID/PID 时（默认 id_table 已覆盖 0c76:1203，无需配置）：
#
# options snd-usb-audio vid=0x0c76 pid=0x1203
